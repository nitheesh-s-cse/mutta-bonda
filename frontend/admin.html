<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Vijaykumar's Mutta Bonda Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body{padding:2rem 1.5rem;max-width:1100px;margin:0 auto;}
  .admin-card{background:var(--charcoal-2);border:1px solid rgba(200,151,63,.18);border-radius:var(--radius-lg);padding:1.8rem;margin-bottom:1.6rem;}
  .admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:1.6rem;}
  .stat{background:var(--charcoal-2);border:1px solid rgba(200,151,63,.16);border-radius:var(--radius);padding:1.2rem;}
  .stat span{display:block;font-family:var(--font-mono);font-size:.68rem;text-transform:uppercase;color:var(--gold-light);margin-bottom:.4rem;}
  .stat strong{font-size:1.4rem;}
  table{width:100%;border-collapse:collapse;font-size:.85rem;}
  th,td{text-align:left;padding:.6rem .5rem;border-bottom:1px solid rgba(200,151,63,.12);}
  th{color:var(--gold-light);font-family:var(--font-mono);font-size:.68rem;text-transform:uppercase;}
  select{padding:.3rem .5rem;font-size:.78rem;}
  #loginView{max-width:380px;margin:4rem auto;}
  #dashView{display:none;}
  .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.6rem;}
  .status-pill{padding:.2rem .6rem;border-radius:100px;font-size:.7rem;font-family:var(--font-mono);border:1px solid var(--gold);}
</style>
</head>
<body>

<div id="loginView" class="admin-card">
  <h2 style="margin-bottom:1rem;">Admin Login</h2>
  <form id="loginForm" style="display:flex;flex-direction:column;gap:1rem;">
    <label>Email<input type="email" name="email" required></label>
    <label>Password<input type="password" name="password" required></label>
    <button class="btn btn--primary" type="submit">Log In</button>
    <p id="loginError" style="color:var(--danger);font-size:.82rem;" hidden></p>
  </form>
</div>

<div id="dashView">
  <div class="top-bar">
    <h1 style="font-size:1.6rem;">Shop Dashboard</h1>
    <button class="btn btn--ghost btn--sm" id="logoutBtn">Log Out</button>
  </div>

  <div class="admin-grid" id="statsGrid"></div>

  <div class="admin-card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:0.5rem;">
      <h3 style="margin:0;">Recent Orders</h3>
      <button class="btn btn--ghost btn--sm" id="clearOrdersBtn" style="color:var(--danger);border-color:rgba(224,72,60,.4);">Clear All Orders</button>
    </div>
    <div class="table-responsive">
      <table>
        <thead><tr><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Placed</th><th>Action</th></tr></thead>
        <tbody id="ordersBody"></tbody>
      </table>
    </div>
  </div>


  <div class="admin-card">
    <h3 style="margin-bottom:1rem;">Add Menu Item</h3>
    <form id="menuForm" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;align-items:end;">
      <label>Name<input type="text" name="name" required></label>
      <label>Price (₹)<input type="number" name="price" required min="0"></label>
      <label>Category
        <select name="category">
          <option>Special Bonda</option><option>Veg Bonda</option><option>Non-Veg Bonda</option>
          <option>Tea</option><option>Coffee</option><option>Juices</option><option>Combo</option>
        </select>
      </label>
      <button class="btn btn--primary btn--sm" type="submit">Add Item</button>
    </form>
  </div>

  <div class="admin-card">
    <h3 style="margin-bottom:1rem;">Menu Items</h3>
    <div class="table-responsive">
      <table>
        <thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Available</th><th></th></tr></thead>
        <tbody id="menuBody"></tbody>
      </table>
    </div>
  </div>
</div>


<!-- Set this to your deployed backend URL (e.g. https://mutta-bonda-shop-api.onrender.com/api) -->
<script>window.API_BASE = localStorage.getItem("vb_api_base") || window.API_BASE || "https://mutta-bonda.onrender.com/api";</script>
<script src="js/admin.js"></script>

</body>
</html>
